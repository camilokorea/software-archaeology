[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-archaeology"
version = "2.0.0"
description = "Clone, point at a legacy codebase, get an evidence-backed technical report and a business report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[project.scripts]
archaeology = "archaeology.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["archaeology*"]

[tool.setuptools.package-data]
archaeology = ["../specs/*.md", "../schemas/*.json", "../prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
